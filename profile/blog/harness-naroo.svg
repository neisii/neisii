<svg xmlns="http://www.w3.org/2000/svg" width="420" height="312" viewBox="0 0 420 312" role="img" aria-label="HARNESS NAROO — AI 에이전트의 결과가 전체와 맞물리는지 확인하기"><title>HARNESS NAROO — AI 에이전트의 결과가 전체와 맞물리는지 확인하기</title><defs><clipPath id="r"><rect width="420" height="312" rx="12"/></clipPath></defs><g clip-path="url(#r)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect width="420" height="312" fill="#ffffff"/><rect x="0" y="0" width="420" height="168" fill="#e8eae6"/><text x="26" y="102" font-size="52" fill="#2b2b2b">◎</text><text x="400" y="90" text-anchor="end" font-size="15" letter-spacing="2.5" font-weight="600" fill="#2b2b2b">HARNESS NAROO</text><text x="20" y="194" font-size="11" fill="#6b7280">2026 — 진행 중 · 개발 도구 · Claude Code 플러그인</text><text x="20" y="218" font-size="16" font-weight="700" fill="#111827">AI 에이전트의 결과가 전체와 맞물리는지</text><text x="20" y="240" font-size="16" font-weight="700" fill="#111827">확인하기</text><text x="20" y="264" font-size="13" fill="#4b5563">AI 에이전트가 &quot;완료&quot;라고 한 결과가 시스템 전체의 정합성을</text><text x="20" y="283" font-size="13" fill="#4b5563">깨지 않는지 확인하는 Claude Code 하네스.</text></g><rect x="0.5" y="0.5" width="419" height="311" rx="12" fill="none" stroke="#d9dce1"/></svg>